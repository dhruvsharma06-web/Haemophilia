name: Build and test

on:
  push:
    branches: ['claude/**', 'codex/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tests:
    name: Server workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest haemophilia_app/firebase/functions/test_workflow.py -q

  rules-tests:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haemophilia_app/firebase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx --yes firebase-tools@latest emulators:exec --project demo-hemo-workflow --only firestore --config ../../firebase.json "npm test"

  checks:
    name: Analyze and test app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haemophilia_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test
      - name: Unit and widget tests
        run: flutter test --concurrency=1

  build:
    # Independent of the checks so an APK is always produced for device testing;
    # the checks job above must also be green before release.
    name: Build APK and admin portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haemophilia_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build web admin portal
        run: flutter build web --release -t lib/main_admin.dart --output build/admin_web
      - uses: actions/upload-artifact@v4
        with:
          name: somaiya-hemophysio-apk
          path: haemophilia_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: admin-portal-web
          path: haemophilia_app/build/admin_web
          if-no-files-found: error

  deploy-admin:
    # Runs only when a FIREBASE_SERVICE_ACCOUNT repository secret exists.
    name: Deploy admin portal to Firebase Hosting
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - uses: actions/download-artifact@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          name: admin-portal-web
          path: haemophilia_app/build/admin_web
      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        working-directory: haemophilia_app
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only hosting:admin --project haemophilia-physiotherapy-ai --non-interactive
      - name: Skipped
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT secret to deploy the admin portal automatically."
