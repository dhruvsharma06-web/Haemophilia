name: haemophilia_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.3
  file_picker: ^12.2.0

  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  google_sign_in: 6.3.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.7.0

  camera: ^0.12.1
  web_socket_channel: ^3.0.3
  image: ^4.9.2

  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icon/haemophysio_logo.png
    - assets/icon/app_icon.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/haemophysio_logo.png"
  adaptive_icon_background: "#F5F7F8"
  adaptive_icon_foreground: "assets/icon/haemophysio_logo.png"
  remove_alpha_ios: true
  background_color_ios: "#F5F7F8"
  web:
    generate: true
    image_path: "assets/icon/haemophysio_logo.png"
    background_color: "#F5F7F8"
    theme_color: "#1B5961"
  windows:
    generate: true
    image_path: "assets/icon/haemophysio_logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/haemophysio_logo.png"
